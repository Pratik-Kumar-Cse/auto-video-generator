[tool.poetry]
name = "fastapi-video-generator"
version = "0.1.0"
description = "FastAPI-based video generation service with comprehensive script and video functionality"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"
motor = "^3.3.2"
pymongo = "^4.6.0"
redis = "^5.0.1"
aioredis = "^2.0.1"
celery = "^5.3.4"
kombu = "^5.3.4"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.2"
aiohttp = "^3.9.1"
email-validator = "^2.1.0"
python-dateutil = "^2.8.2"
structlog = "^23.2.0"
rich = "^13.7.0"
requests = "^2.31.0"
Jinja2 = "^3.1.2"
pyautogen = "^0.2.0"
opencv-python = "^4.8.1.78"
Pillow = "^10.1.0"
mutagen = "^1.47.0"
boto3 = "^1.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-mock = "^3.12.0"
black = "^23.11.0"
flake8 = "^6.1.0"
isort = "^5.12.0"

[tool.poetry.group.optional.dependencies]
opencv-python = {version = "^4.8.1.78", optional = true}
Pillow = {version = "^10.1.0", optional = true}
moviepy = {version = "^1.0.3", optional = true}
boto3 = {version = "^1.34.0", optional = true}
google-cloud-storage = {version = "^2.10.0", optional = true}

[tool.poetry.extras]
video = ["opencv-python", "Pillow", "moviepy"]
cloud = ["boto3", "google-cloud-storage"]
all = ["opencv-python", "Pillow", "moviepy", "boto3", "google-cloud-storage"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Poetry scripts are removed - use poetry run commands directly instead